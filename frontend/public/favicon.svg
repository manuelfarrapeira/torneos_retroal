<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#080c18" />
  <!-- Neon Arcade Border -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#0055d4" stroke-width="1.5" shape-rendering="auto" />
  
  <!-- Arcade Deck Base -->
  <rect x="3" y="19" width="26" height="9" rx="2" fill="#1e293b" />
  <rect x="4" y="20" width="24" height="1" fill="#334155" />
  <rect x="3" y="19" width="26" height="9" rx="2" fill="none" stroke="#0055d4" stroke-width="1" shape-rendering="auto" />

  <!-- Joystick Washer Base -->
  <rect x="7" y="17" width="7" height="3" fill="#0f172a" />
  <rect x="8" y="18" width="5" height="1" fill="#475569" />

  <!-- Joystick Shaft -->
  <rect x="9" y="11" width="3" height="7" fill="#cbd5e1" />
  <rect x="9" y="11" width="1" height="7" fill="#ffffff" />
  <rect x="11" y="11" width="1" height="7" fill="#64748b" />

  <!-- Joystick Ball Top (Red Arcade Sphere) -->
  <rect x="7" y="5" width="7" height="7" rx="1" fill="#ff0055" />
  <rect x="8" y="4" width="5" height="1" fill="#ff0055" />
  <rect x="8" y="12" width="5" height="1" fill="#b91c1c" />
  <rect x="6" y="6" width="1" height="5" fill="#ff0055" />
  <rect x="14" y="6" width="1" height="5" fill="#b91c1c" />
  <!-- Shiny Highlight -->
  <rect x="8" y="5" width="2" height="2" fill="#ffffff" />
  <rect x="8" y="7" width="1" height="1" fill="#ff99bb" />

  <!-- Arcade Buttons -->
  <!-- Red Button -->
  <rect x="15" y="22" width="3" height="3" rx="1" fill="#ff0055" />
  <rect x="15" y="22" width="3" height="1" fill="#ff6699" />
  <!-- Yellow Button -->
  <rect x="19" y="21" width="3" height="3" rx="1" fill="#ffcc00" />
  <rect x="19" y="21" width="3" height="1" fill="#fffaaa" />
  <!-- Blue Button -->
  <rect x="23" y="22" width="3" height="3" rx="1" fill="#00d4ff" />
  <rect x="23" y="22" width="3" height="1" fill="#99f0ff" />

  <!-- Retro Gold Coin / Trophy in Top Right -->
  <rect x="20" y="5" width="8" height="8" rx="2" fill="#fbbf24" />
  <rect x="21" y="6" width="6" height="6" fill="#f59e0b" />
  <rect x="21" y="6" width="2" height="2" fill="#fef08a" />
  <!-- Star symbol in coin -->
  <rect x="23" y="7" width="2" height="4" fill="#78350f" />
  <rect x="22" y="8" width="4" height="2" fill="#78350f" />
  <rect x="23" y="8" width="2" height="2" fill="#fef08a" />
</svg>